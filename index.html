<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>চ্যাট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f13;--surface:#16181f;--card:#1c1f2a;--border:#252836;
  --accent:#7c6af7;--danger:#f87171;--text:#e8eaf0;
  --muted:#6b7280;--me-bg:linear-gradient(135deg,#7c6af7,#6355e0);
  --them-bg:#1e2235;--online:#34d399;
}
*{-webkit-user-select:none;user-select:none}
body{-webkit-touch-callout:none}
@media print{body{display:none!important}}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
#name-screen{width:100%;max-width:380px;padding:32px 24px;animation:fadeUp .4s ease}
.logo{text-align:center;margin-bottom:36px}
.logo h1{font-family:'IBM Plex Mono',monospace;font-size:1.8rem;color:var(--accent);letter-spacing:.05em}
.logo p{color:var(--muted);font-size:.85rem;margin-top:6px}
.name-form{display:flex;flex-direction:column;gap:14px}
.ig{display:flex;flex-direction:column;gap:6px}
.ig label{font-size:.8rem;color:var(--muted);font-weight:500}
.ig input{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'Hind Siliguri',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text}
.ig input:focus{border-color:var(--accent)}
.join-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Hind Siliguri',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
.join-btn:hover{opacity:.88}
.join-btn:active{transform:scale(.98)}
#name-error{color:var(--danger);font-size:.82rem;text-align:center;min-height:18px}
#chat-screen{display:none;width:100%;max-width:480px;height:100dvh;flex-direction:column;background:var(--bg)}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.chl{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#fff;flex-shrink:0}
.chat-title{font-weight:600;font-size:.97rem}
.chat-sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.chat-sub span{color:var(--online)}
.leave-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:6px 12px;font-size:.75rem;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:all .2s}
.leave-btn:hover{border-color:var(--danger);color:var(--danger)}
#online-bar{padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);font-size:.75rem;color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#online-bar strong{color:var(--online)}
#messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.msg-row{display:flex;flex-direction:column;max-width:78%;animation:msgIn .18s ease}
.msg-row.me{align-self:flex-end;align-items:flex-end}
.msg-row.them{align-self:flex-start;align-items:flex-start}
.msg-name{font-size:.7rem;color:var(--muted);margin-bottom:3px;padding:0 4px}
.bubble{padding:9px 13px;border-radius:16px;font-size:.93rem;line-height:1.5;word-break:break-word}
.me .bubble{background:var(--me-bg);color:#fff;border-bottom-right-radius:4px}
.them .bubble{background:var(--them-bg);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.msg-time{font-size:.65rem;color:var(--muted);margin-top:3px;padding:0 4px;font-family:'IBM Plex Mono',monospace}
.sys-msg{align-self:center;font-size:.72rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:4px 12px;border-radius:999px;animation:msgIn .2s ease}
.input-bar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;align-items:flex-end}
#msg-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-family:'Hind Siliguri',sans-serif;font-size:.93rem;outline:none;resize:none;max-height:100px;line-height:1.4;transition:border-color .2s;-webkit-user-select:text;user-select:text}
#msg-input:focus{border-color:var(--accent)}
#msg-input:disabled{opacity:.4}
#send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .1s;flex-shrink:0}
#send-btn:hover:not(:disabled){opacity:.85}
#send-btn:active:not(:disabled){transform:scale(.93)}
#send-btn:disabled{opacity:.3;cursor:not-allowed}
#send-btn svg{width:18px;height:18px;fill:#fff;transform:translateX(1px)}
#conn-badge{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;font-size:.75rem;padding:5px 14px;border-radius:999px;display:none;z-index:99;font-family:'IBM Plex Mono',monospace}
#ss-block{display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#ss-block p{color:#fff;font-size:1.1rem;font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div id="ss-block"><p>🚫</p><p>Screenshot নেওয়া যাবে না</p></div>
<div id="conn-badge">সংযোগ বিচ্ছিন্ন — পুনরায় সংযুক্ত হচ্ছে...</div>

<div id="name-screen">
  <div class="logo">
    <h1>💬 চ্যাট</h1>
    <p>আপনার নাম দিয়ে যোগ দিন</p>
  </div>
  <div class="name-form">
    <div class="ig">
      <label>আপনার নাম</label>
      <input type="text" id="uname" placeholder="নাম লিখুন..." autocomplete="off" maxlength="20"/>
    </div>
    <div id="name-error"></div>
    <button class="join-btn" onclick="joinChat()">যোগ দিন &rarr;</button>
  </div>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <div class="chl">
      <div class="avatar" id="my-avatar">?</div>
      <div>
        <div class="chat-title" id="my-name">—</div>
        <div class="chat-sub"><span id="online-count">০</span> জন অনলাইন</div>
      </div>
    </div>
    <button class="leave-btn" onclick="doLeave()">বের হন</button>
  </div>
  <div id="online-bar">অনলাইন: লোড হচ্ছে...</div>
  <div id="messages"></div>
  <div class="input-bar">
    <textarea id="msg-input" placeholder="মেসেজ লিখুন..." disabled rows="1"></textarea>
    <button id="send-btn" disabled onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const WS_URL=location.protocol==="https:"?`wss://${location.host}`:`ws://${location.host}`;
let ws=null,myUsername=null,reconnectTimer=null;
const $ns=document.getElementById("name-screen");
const $cs=document.getElementById("chat-screen");
const $msgs=document.getElementById("messages");
const $input=document.getElementById("msg-input");
const $sb=document.getElementById("send-btn");
const $ne=document.getElementById("name-error");
const $ob=document.getElementById("online-bar");
const $oc=document.getElementById("online-count");
const $cb=document.getElementById("conn-badge");
const $mn=document.getElementById("my-name");
const $ma=document.getElementById("my-avatar");
const $un=document.getElementById("uname");
const $ss=document.getElementById("ss-block");

function showSS(){$ss.style.display="flex";setTimeout(()=>{$ss.style.display="none"},1500)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&myUsername)showSS()});
document.addEventListener("keydown",(e)=>{
  if(e.key==="PrintScreen"||(e.ctrlKey&&e.shiftKey&&"sS".includes(e.key))){e.preventDefault();showSS()}
});
document.addEventListener("contextmenu",e=>e.preventDefault());

function joinChat(){
  const name=$un.value.trim();
  if(!name||name.length<2){$ne.textContent="কমপক্ষে ২ অক্ষরের নাম দিন।";return}
  if(!ws||ws.readyState!==WebSocket.OPEN){$ne.textContent="সংযুক্ত হচ্ছে...";return}
  ws.send(JSON.stringify({type:"join",username:name}));
}
$un.addEventListener("keydown",e=>{if(e.key==="Enter")joinChat()});

function showChat(u){
  myUsername=u;$mn.textContent=u;$ma.textContent=u[0].toUpperCase();
  $ns.style.display="none";$cs.style.display="flex";
  $input.disabled=false;$sb.disabled=false;$input.focus();
}

function addMsg(text,who,uname,time){
  if(who==="sys"){
    const el=document.createElement("div");el.className="sys-msg";el.textContent=text;$msgs.appendChild(el);
  }else{
    const r=document.createElement("div");r.className=`msg-row ${who}`;
    r.innerHTML=`${who==="them"?`<div class="msg-name">${esc(uname)}</div>`:""}
      <div class="bubble">${esc(text)}</div><div class="msg-time">${time}</div>`;
    $msgs.appendChild(r);
  }
  $msgs.scrollTop=$msgs.scrollHeight;
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function updateOnline(list){
  $oc.textContent=list.length;
  $ob.innerHTML="অনলাইন: "+list.map(u=>`<strong>${esc(u)}</strong>`).join(", ");
}

function sendMessage(){
  const text=$input.value.trim();
  if(!text||!ws||ws.readyState!==WebSocket.OPEN)return;
  ws.send(JSON.stringify({type:"message",text}));
  $input.value="";$input.style.height="auto";$input.focus();
}
$input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
$input.addEventListener("input",()=>{$input.style.height="auto";$input.style.height=Math.min($input.scrollHeight,100)+"px"});

function doLeave(){
  if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:"logout"}));
  myUsername=null;$msgs.innerHTML="";$input.value="";$input.disabled=true;
  $un.value="";$ne.textContent="";$cs.style.display="none";$ns.style.display="block";
}

function connect(){
  if(ws){try{ws.close()}catch(e){}}
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{$cb.style.display="none";clearTimeout(reconnectTimer)};
  ws.onmessage=(e)=>{
    let d;try{d=JSON.parse(e.data)}catch{return}
    if(d.type==="error")$ne.textContent=d.msg;
    else if(d.type==="logged-in")showChat(d.username);
    else if(d.type==="message")addMsg(d.text,d.username===myUsername?"me":"them",d.username,d.time);
    else if(d.type==="user-joined"){addMsg(`${d.username} যোগ দিয়েছেন`,"sys");updateOnline(d.online)}
    else if(d.type==="user-left"){addMsg(`${d.username} চলে গেছেন`,"sys");updateOnline(d.online)}
    else if(d.type==="online-list")updateOnline(d.online);
  };
  ws.onclose=()=>{if(myUsername){$cb.style.display="block";reconnectTimer=setTimeout(connect,3000)}};
  ws.onerror=()=>{$ne.textContent="সার্ভারে সংযোগ হচ্ছে না।"};
}
connect();
</script>
</body>
</html>
