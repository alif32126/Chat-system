<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>চ্যাট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0e0f13;
  --surface:#16181f;
  --card:#1c1f2a;
  --border:#252836;
  --accent:#7c6af7;
  --accent2:#5eead4;
  --danger:#f87171;
  --text:#e8eaf0;
  --muted:#6b7280;
  --me-bg:linear-gradient(135deg,#7c6af7,#6355e0);
  --them-bg:#1e2235;
  --online:#34d399;
}

body{
  font-family:'Hind Siliguri',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ══ AUTH SCREEN ══ */
#auth-screen{
  width:100%;
  max-width:400px;
  padding:24px 20px;
  animation:fadeUp .4s ease;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}

.auth-logo{
  text-align:center;
  margin-bottom:32px;
}
.auth-logo h1{
  font-family:'IBM Plex Mono',monospace;
  font-size:1.6rem;
  color:var(--accent);
  letter-spacing:.05em;
}
.auth-logo p{color:var(--muted);font-size:.85rem;margin-top:4px}

.auth-tabs{
  display:flex;
  background:var(--surface);
  border-radius:10px;
  padding:4px;
  margin-bottom:24px;
  border:1px solid var(--border);
}
.auth-tab{
  flex:1;
  padding:9px;
  text-align:center;
  border-radius:7px;
  cursor:pointer;
  font-size:.9rem;
  color:var(--muted);
  transition:all .2s;
  font-weight:500;
}
.auth-tab.active{background:var(--accent);color:#fff}

.auth-form{display:flex;flex-direction:column;gap:12px}

.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:.8rem;color:var(--muted);font-weight:500}
.input-group input{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 14px;
  color:var(--text);
  font-family:'Hind Siliguri',sans-serif;
  font-size:.95rem;
  outline:none;
  transition:border-color .2s;
}
.input-group input:focus{border-color:var(--accent)}

.auth-btn{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:12px;
  font-family:'Hind Siliguri',sans-serif;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  margin-top:4px;
  transition:opacity .2s,transform .1s;
}
.auth-btn:hover{opacity:.88}
.auth-btn:active{transform:scale(.98)}

#auth-error{
  color:var(--danger);
  font-size:.82rem;
  text-align:center;
  min-height:18px;
  animation:fadeUp .2s ease;
}

/* ══ CHAT SCREEN ══ */
#chat-screen{
  display:none;
  width:100%;
  max-width:480px;
  height:100dvh;
  flex-direction:column;
  background:var(--bg);
}

/* header */
.chat-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.chat-header-left{display:flex;align-items:center;gap:10px}
.chat-avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.9rem;color:#fff;
  flex-shrink:0;
}
.chat-title{font-weight:600;font-size:.97rem}
.chat-subtitle{font-size:.72rem;color:var(--muted);margin-top:1px}
.chat-subtitle span{color:var(--online)}

.logout-btn{
  background:none;
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--muted);
  padding:6px 12px;
  font-size:.75rem;
  font-family:'Hind Siliguri',sans-serif;
  cursor:pointer;
  transition:all .2s;
}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

/* online bar */
#online-bar{
  padding:8px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  font-size:.75rem;
  color:var(--muted);
  flex-shrink:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#online-bar strong{color:var(--online)}

/* messages */
#messages{
  flex:1;
  overflow-y:auto;
  padding:16px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.msg-row{
  display:flex;
  flex-direction:column;
  max-width:78%;
  animation:msgIn .18s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}

.msg-row.me{align-self:flex-end;align-items:flex-end}
.msg-row.them{align-self:flex-start;align-items:flex-start}

.msg-name{
  font-size:.7rem;
  color:var(--muted);
  margin-bottom:3px;
  padding:0 4px;
}

.bubble{
  padding:9px 13px;
  border-radius:16px;
  font-size:.93rem;
  line-height:1.5;
  word-break:break-word;
}
.me .bubble{
  background:var(--me-bg);
  color:#fff;
  border-bottom-right-radius:4px;
}
.them .bubble{
  background:var(--them-bg);
  border:1px solid var(--border);
  color:var(--text);
  border-bottom-left-radius:4px;
}

.msg-time{
  font-size:.65rem;
  color:var(--muted);
  margin-top:3px;
  padding:0 4px;
  font-family:'IBM Plex Mono',monospace;
}

.sys-msg{
  align-self:center;
  font-size:.72rem;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--border);
  padding:4px 12px;
  border-radius:999px;
  animation:msgIn .2s ease;
}

/* typing indicator */
.typing-dots{display:flex;gap:3px;padding:10px 14px}
.typing-dots span{
  width:6px;height:6px;
  background:var(--muted);
  border-radius:50%;
  animation:dot .9s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}

/* input bar */
.input-bar{
  display:flex;
  gap:8px;
  padding:12px 14px;
  border-top:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
  align-items:flex-end;
}
#msg-input{
  flex:1;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:10px 16px;
  color:var(--text);
  font-family:'Hind Siliguri',sans-serif;
  font-size:.93rem;
  outline:none;
  resize:none;
  max-height:100px;
  line-height:1.4;
  transition:border-color .2s;
}
#msg-input:focus{border-color:var(--accent)}
#msg-input:disabled{opacity:.4}

#send-btn{
  width:42px;height:42px;
  border-radius:50%;
  background:var(--accent);
  border:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .1s;
  flex-shrink:0;
}
#send-btn:hover:not(:disabled){opacity:.85}
#send-btn:active:not(:disabled){transform:scale(.93)}
#send-btn:disabled{opacity:.3;cursor:not-allowed}
#send-btn svg{width:18px;height:18px;fill:#fff;transform:translateX(1px)}

/* connection badge */
#conn-badge{
  position:fixed;
  top:10px;left:50%;
  transform:translateX(-50%);
  background:var(--danger);
  color:#fff;
  font-size:.75rem;
  padding:5px 14px;
  border-radius:999px;
  display:none;
  z-index:99;
  font-family:'IBM Plex Mono',monospace;
}
</style>
</head>
<body>

<div id="conn-badge">⚠ সংযোগ বিচ্ছিন্ন — পুনরায় সংযুক্ত হচ্ছে...</div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">
    <h1>💬 চ্যাট</h1>
    <p>যেকেউ যোগ দিতে পারবে</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" onclick="switchTab('login')">লগইন</div>
    <div class="auth-tab" onclick="switchTab('register')">নতুন একাউন্ট</div>
  </div>

  <div class="auth-form">
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="username-input" placeholder="আপনার নাম লিখুন" autocomplete="off"/>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password-input" placeholder="পাসওয়ার্ড লিখুন"/>
    </div>
    <div id="auth-error"></div>
    <button class="auth-btn" id="auth-submit-btn" onclick="submitAuth()">লগইন করুন</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="chat-avatar" id="my-avatar">?</div>
      <div>
        <div class="chat-title" id="my-username-label">—</div>
        <div class="chat-subtitle"><span id="online-count">০</span> জন অনলাইন</div>
      </div>
    </div>
    <button class="logout-btn" onclick="doLogout()">লগআউট</button>
  </div>

  <div id="online-bar">অনলাইন: লোড হচ্ছে...</div>

  <div id="messages"></div>

  <div class="input-bar">
    <textarea id="msg-input" placeholder="মেসেজ লিখুন..." disabled rows="1"></textarea>
    <button id="send-btn" disabled onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ── CONFIG ──
const WS_URL = location.protocol === "https:"
  ? `wss://${location.host}`
  : `ws://${location.host}`;

// ── STATE ──
let ws = null;
let myUsername = null;
let currentTab = "login";
let reconnectTimer = null;

// ── DOM ──
const $auth = document.getElementById("auth-screen");
const $chat = document.getElementById("chat-screen");
const $msgs = document.getElementById("messages");
const $input = document.getElementById("msg-input");
const $sendBtn = document.getElementById("send-btn");
const $authError = document.getElementById("auth-error");
const $onlineBar = document.getElementById("online-bar");
const $onlineCount = document.getElementById("online-count");
const $connBadge = document.getElementById("conn-badge");
const $myLabel = document.getElementById("my-username-label");
const $myAvatar = document.getElementById("my-avatar");
const $usernameInput = document.getElementById("username-input");
const $passwordInput = document.getElementById("password-input");
const $submitBtn = document.getElementById("auth-submit-btn");

// ── AUTH UI ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".auth-tab").forEach((t, i) => {
    t.classList.toggle("active", (i === 0 && tab === "login") || (i === 1 && tab === "register"));
  });
  $submitBtn.textContent = tab === "login" ? "লগইন করুন" : "একাউন্ট তৈরি করুন";
  $authError.textContent = "";
}

function showError(msg) {
  $authError.textContent = msg;
}

function submitAuth() {
  const username = $usernameInput.value.trim();
  const password = $passwordInput.value.trim();
  if (!username || !password) return showError("username ও password দিন।");
  if (!ws || ws.readyState !== WebSocket.OPEN) return showError("সার্ভারে সংযুক্ত হচ্ছে, একটু অপেক্ষা করুন।");
  ws.send(JSON.stringify({ type: currentTab === "login" ? "login" : "register", username, password }));
}

// Enter key
[$usernameInput, $passwordInput].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") submitAuth(); });
});

// ── CHAT UI ──
function showChat(username) {
  myUsername = username;
  $myLabel.textContent = username;
  $myAvatar.textContent = username[0].toUpperCase();
  $auth.style.display = "none";
  $chat.style.display = "flex";
  $input.disabled = false;
  $sendBtn.disabled = false;
  $input.focus();
}

function addMsg(text, who, username, time) {
  if (who === "sys") {
    const el = document.createElement("div");
    el.className = "sys-msg";
    el.textContent = text;
    $msgs.appendChild(el);
  } else {
    const row = document.createElement("div");
    row.className = `msg-row ${who}`;
    row.innerHTML = `
      ${who === "them" ? `<div class="msg-name">${esc(username)}</div>` : ""}
      <div class="bubble">${esc(text)}</div>
      <div class="msg-time">${time}</div>`;
    $msgs.appendChild(row);
  }
  $msgs.scrollTop = $msgs.scrollHeight;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function updateOnline(list) {
  $onlineCount.textContent = list.length;
  $onlineBar.innerHTML = "অনলাইন: " + list.map(u =>
    `<strong>${esc(u)}</strong>`).join(", ");
}

function sendMessage() {
  const text = $input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "message", text }));
  $input.value = "";
  $input.style.height = "auto";
  $input.focus();
}

$input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$input.addEventListener("input", () => {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 100) + "px";
});

function doLogout() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "logout" }));
  }
  // সব মুছে ফেলো
  myUsername = null;
  $msgs.innerHTML = "";
  $input.value = "";
  $input.disabled = true;
  $sendBtn.disabled = false;
  $usernameInput.value = "";
  $passwordInput.value = "";
  $authError.textContent = "";
  $chat.style.display = "none";
  $auth.style.display = "block";
}

// ── WEBSOCKET ──
function connect() {
  if (ws) { try { ws.close(); } catch(e){} }
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    $connBadge.style.display = "none";
    clearTimeout(reconnectTimer);
  };

  ws.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }

    if (data.type === "error") {
      showError(data.msg);
    }
    else if (data.type === "registered") {
      showError(""); 
      switchTab("login");
      $authError.style.color = "var(--accent2)";
      $authError.textContent = "✓ " + data.msg;
      setTimeout(() => { $authError.style.color = "var(--danger)"; }, 3000);
    }
    else if (data.type === "logged-in") {
      showChat(data.username);
    }
    else if (data.type === "message") {
      const who = data.username === myUsername ? "me" : "them";
      addMsg(data.text, who, data.username, data.time);
    }
    else if (data.type === "user-joined") {
      addMsg(`${data.username} যোগ দিয়েছেন 👋`, "sys");
      updateOnline(data.online);
    }
    else if (data.type === "user-left") {
      addMsg(`${data.username} চলে গেছেন`, "sys");
      updateOnline(data.online);
    }
    else if (data.type === "online-list") {
      updateOnline(data.online);
    }
  };

  ws.onclose = () => {
    if (myUsername) {
      $connBadge.style.display = "block";
      reconnectTimer = setTimeout(connect, 3000);
    }
  };

  ws.onerror = () => {
    showError("সার্ভারে সংযোগ করতে পারছে না।");
  };
}

// ── START ──
connect();
</script>
</body>
</html>
